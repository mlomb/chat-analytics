[package]
name = "app_worker"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
bincode = { version = "2.0.1", features = ["serde"] }
chat_analytics = { version = "0.1.0", path = "../../chat_analytics" }
console_error_panic_hook = "0.1.7"
js-sys = "0.3.81"
serde_json = "1.0.145"
wasm-bindgen = "0.2.104"
wasm-bindgen-file-reader = "1.0.0"
web-sys = { version = "0.3.81", features = ["File", "console", "DedicatedWorkerGlobalScope", "MessageEvent"] }

[profile.release]
lto = true
