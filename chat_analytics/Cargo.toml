[package]
name = "chat_analytics"
version = "0.1.0"
edition = "2024"

[dependencies]
bincode = { version = "2.0.1", features = ["serde"] }
chrono = { version = "0.4.42", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.5.48", features = ["derive"] }
indexmap = { version = "2.11.4", features = ["serde"] }
indicatif = "0.18.0"
regex = "1.11.3"
serde = { version = "1.0.226", features = ["serde_derive"] }
serde_json = "1.0.145"
serde_with = "3.15.0"
struson = { version = "0.6.0", features = ["serde"] }
ts-rs = "11.1.0"
unicode-normalization = "0.1.24"
url = "2.5.7"

[[bin]]
name = "chat-analytics"
path = "src/bin/cli.rs"

[lib]
crate-type = ["cdylib", "rlib"]
